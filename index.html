<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holm League Parlay</title>
<meta name="description" content="Live weekly parlay tracker for Our Holm League">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Holm Parlay">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="topline">
      <a class="lockup" href="#week" aria-label="Holm Parlay home">
        <svg class="lockup__mark" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true" focusable="false">
          <defs>
            <clipPath id="lockup-slip"><rect x="3" y="12" width="58" height="40" rx="4"/></clipPath>
            <clipPath id="lockup-ball"><ellipse cx="38" cy="32" rx="18" ry="11"/></clipPath>
          </defs>
          <rect class="mark__ticket" x="3" y="12" width="58" height="40" rx="4"/>
          <g clip-path="url(#lockup-slip)">
            <rect class="mark__stub" x="3" y="12" width="8" height="40"/>
            <circle class="mark__perf" cx="15.5" cy="18" r="1.6"/>
            <circle class="mark__perf" cx="15.5" cy="25" r="1.6"/>
            <circle class="mark__perf" cx="15.5" cy="32" r="1.6"/>
            <circle class="mark__perf" cx="15.5" cy="39" r="1.6"/>
            <circle class="mark__perf" cx="15.5" cy="46" r="1.6"/>
          </g>
          <ellipse class="mark__ball" cx="38" cy="32" rx="18" ry="11"/>
          <g clip-path="url(#lockup-ball)">
            <path class="mark__lace" d="M24 32h28"/>
            <path class="mark__lace" d="M31 26.5v11M35.5 25.5v13M40 25v14M44.5 25.5v13M49 26.5v11"/>
          </g>
          <circle class="mark__chip" cx="51" cy="44" r="7"/>
          <circle class="mark__chip-ring" cx="51" cy="44" r="4"/>
          <circle class="mark__chip-pip" cx="51" cy="44" r="1.2"/>
        </svg>
        <span class="lockup__type">
          <span class="lockup__name">Holm Parlay</span>
          <span class="eyebrow" id="leagueName">Our Holm League · 2026</span>
        </span>
      </a>
      <div class="tools">
        <nav class="desknav" aria-label="Sections">
          <a class="btn btn--ghost btn--sm" href="#week" data-nav="week">Week</a>
          <a class="btn btn--ghost btn--sm" href="#pick" data-nav="pick">Pick</a>
          <a class="btn btn--ghost btn--sm" href="#standings" data-nav="standings">Standings</a>
          <a class="btn btn--ghost btn--sm" href="#league" data-nav="league">League</a>
          <a class="btn btn--ghost btn--sm" href="#history" data-nav="history">Bets</a>
          <a class="btn btn--ghost btn--sm" href="#chat" data-nav="chat">Chat</a>
          <a class="btn btn--ghost btn--sm" href="#admin" data-nav="admin">Commissioner</a>
        </nav>
        <a class="btn btn--ghost btn--sm" id="chatLink" href="#" target="_blank" rel="noopener" hidden>WhatsApp</a>
        <button class="btn btn--ghost btn--sm" id="themeBtn" type="button" aria-label="Toggle light and dark">Light</button>
      </div>
    </div>
    <h1 id="pageTitle">Parlay</h1>
    <span class="sub" id="pageSub">Loading…</span>
  </header>

  <main id="view"></main>
</div>

<nav class="bottomnav" aria-label="Sections">
  <a href="#week" data-nav="week">Week</a>
  <a href="#pick" data-nav="pick">Pick</a>
  <a href="#standings" data-nav="standings">Standings</a>
  <a href="#league" data-nav="league">League</a>
  <a href="#history" data-nav="history">Bets</a>
  <a href="#chat" data-nav="chat">Chat</a>
  <a href="#admin" data-nav="admin">Admin</a>
</nav>

<script src="/app.js"></script>
</body>
</html>
